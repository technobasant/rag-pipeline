name: Docker Build and Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.api
            image: rag-api
          - dockerfile: Dockerfile.airflow
            image: airflow
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-compose:
    name: Update Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update docker-compose.yaml with new tags
        run: |
          VERSION=${{ github.event.release.tag_name }}
          sed -i "s|image: ghcr.io/${{ github.repository }}-rag-api:.*|image: ghcr.io/${{ github.repository }}-rag-api:${VERSION}|g" docker-compose.yaml
          sed -i "s|image: ghcr.io/${{ github.repository }}-airflow:.*|image: ghcr.io/${{ github.repository }}-airflow:${VERSION}|g" docker-compose.yaml
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update docker images to ${{ github.event.release.tag_name }}"
          title: "Update Docker images to ${{ github.event.release.tag_name }}"
          body: |
            This PR updates the Docker image tags in docker-compose.yaml to version ${{ github.event.release.tag_name }}.
            
            Auto-generated by GitHub Actions.
          branch: update-docker-tags-${{ github.event.release.tag_name }}
          delete-branch: true 