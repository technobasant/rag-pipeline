# Web Scraping Configuration
# Target: Python 3 Tutorial Documentation (docs.python.org)

site:
  name: "Python 3 Tutorial"
  base_url: "https://docs.python.org/3/tutorial/"
  description: "Official Python 3 tutorial documentation"
  
scraping:
  # Rate limiting
  delay_seconds: 1
  max_concurrent: 3
  timeout_seconds: 30
  
  # Request headers
  user_agent: "Mozilla/5.0 (compatible; DataLakeBot/1.0; +https://example.com/bot)"
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.5"
    Accept-Encoding: "gzip, deflate"
    DNT: "1"
    Connection: "keep-alive"
    Upgrade-Insecure-Requests: "1"

  # Robots.txt compliance
  respect_robots: true
  robots_url: "https://docs.python.org/robots.txt"

# Content extraction rules
extraction:
  # Main content selectors
  content_selector: "div.body"
  title_selector: "h1"
  
  # Elements to remove (navigation, ads, etc.)
  remove_selectors:
    - "div.sphinxsidebar"
    - "div.related"
    - "div.footer"
    - "script"
    - "style"
    - "nav"
  
  # Text cleaning
  clean_text: true
  min_text_length: 100
  remove_extra_whitespace: true

# URL patterns and limits
urls:
  # Starting URLs
  start_urls:
    - "https://docs.python.org/3/tutorial/index.html"
    - "https://docs.python.org/3/tutorial/introduction.html"
    - "https://docs.python.org/3/tutorial/controlflow.html"
    - "https://docs.python.org/3/tutorial/datastructures.html"
    - "https://docs.python.org/3/tutorial/modules.html"
    - "https://docs.python.org/3/tutorial/inputoutput.html"
    - "https://docs.python.org/3/tutorial/errors.html"
    - "https://docs.python.org/3/tutorial/classes.html"
    - "https://docs.python.org/3/tutorial/stdlib.html"
    - "https://docs.python.org/3/tutorial/stdlib2.html"
    - "https://docs.python.org/3/tutorial/venv.html"
    - "https://docs.python.org/3/tutorial/whatnow.html"
    - "https://docs.python.org/3/tutorial/interactive.html"
    - "https://docs.python.org/3/tutorial/floatingpoint.html"
    - "https://docs.python.org/3/tutorial/appendix.html"

  # URL patterns to follow
  follow_patterns:
    - "https://docs.python.org/3/tutorial/*.html"
  
  # URL patterns to ignore
  ignore_patterns:
    - "*.pdf"
    - "*.zip"
    - "*#*"  # Skip anchor links
    - "*/genindex.html"
    - "*/modindex.html"
    - "*/search.html"
  
  # Limits
  max_pages: 50
  max_depth: 2

# Output configuration
output:
  # MinIO storage paths
  raw_html_prefix: "raw/html"
  raw_text_prefix: "raw/text"
  
  # File naming
  filename_template: "{timestamp}_{slug}.html"
  text_filename_template: "{timestamp}_{slug}.txt"
  
  # Metadata to capture
  metadata_fields:
    - "url"
    - "title"
    - "timestamp"
    - "content_length"
    - "status_code"
    - "response_time"

# Quality checks
quality:
  # Minimum content requirements
  min_content_length: 500
  min_word_count: 50
  
  # Content validation
  required_elements:
    - "title"
  
  # Skip pages with these indicators
  skip_if_contains:
    - "404 Not Found"
    - "Page not found"
    - "Access denied"

LITELLM_API_BASE: "http://localhost:11434"  # Ollama local endpoint
LITELLM_MODEL: "llama2"  # or any supported model
LITELLM_EMBED_MODEL: "llama2"  # can be same as LITELLM_MODEL
# LITELLM_API_KEY: ""  # Only needed for remote providers