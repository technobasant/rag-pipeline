<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat Interface</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🤖 RAG Chat Assistant</h1>
            <div class="status-indicator">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="message assistant">
                    <div class="message-content">
                        <p>👋 Hello! I'm your RAG assistant. I can help you find information from the knowledge base. Ask me anything!</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type your question here..." 
                    rows="1"
                    maxlength="2000"
                ></textarea>
                <button id="sendButton" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22,2 15,22 11,13 2,9"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="streamingToggle" checked>
                    <span class="checkmark"></span>
                    Enable streaming
                </label>
                <div class="top-k-selector">
                    <label for="topKSelect">Sources:</label>
                    <select id="topKSelect">
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <!-- <div class="threshold-selector">
                    <label for="similarity-threshold">Similarity: <span id="threshold-value">0.3</span></label>
                    <input type="range" id="similarity-threshold" min="0" max="1" step="0.1" value="0.3">
                </div> -->
            </div>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
