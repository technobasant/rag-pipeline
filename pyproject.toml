[project]
name = "rag-pipeline"
version = "0.1.0"
description = "End-to-end scrape-to-RAG lakehouse: Airflow, Spark bronze/silver/gold on Delta and MinIO, Chroma, and a FastAPI answer service with OpenLineage."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Basant Bhattarai" }]
requires-python = ">=3.11"
# Mirrors requirements.txt, which the Docker images install. Airflow itself
# comes from the Airflow base image (Dockerfile.airflow), not from here.
dependencies = [
    "fastapi",
    "uvicorn",
    "pyspark==3.5.5",
    "deltalake",
    "pyarrow",
    "duckdb",
    "polars",
    "pyiceberg",
    "beautifulsoup4",
    "playwright",
    "requests",
    "minio",
    "s3fs",
    "boto3",
    "chromadb",
    "faiss-cpu",
    "sentence-transformers",
    "torch",
    "transformers",
    "ollama",
    "openlineage-python==1.35.0",
    "prometheus-client",
    "structlog",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "python-multipart",
    "email-validator>=2.0",
    "trio",
]

[dependency-groups]
dev = ["pytest", "pytest-mock", "ruff"]

[tool.ruff]
target-version = "py311"
