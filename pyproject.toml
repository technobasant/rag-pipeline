[project]
name = "app-info-mcp"
version = "1.0.0"
description = "MCP Server providing essential app info such as app versions, screen names and events names for a given app id"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.8.0",
    "fastapi>=0.115.12",
    "uvicorn>=0.24.0",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=20.0.0",
    "sqlalchemy>=2.0.41",
    "trino[sqlalchemy]>=0.334.0",
    "python-dotenv>=1.0.0",
    "uvloop==0.21.0",
    "pyyaml>=6.0.2",
    "pytest>=8.4.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.6",
    "httpx>=0.28.1",
    "redis>=5.0.0",
    "cachetools>=5.3.0",
    "motor==3.3.2",
    "pymongo==4.6.1",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
    "authlib>=1.6.0",
    "pyjwt>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "openai>=1.0.0",
    "pgvector>=0.2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.10",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "config", "database", "services", "static"]
